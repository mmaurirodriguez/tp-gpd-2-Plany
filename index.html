<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plany · Prototipo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --coral:#EE4B4B; --coral-2:#F26B6B; --coral-soft:#FDE8E6; --coral-ink:#B92F2F;
  --cream:#F1EFEA; --paper:#FFFFFF; --ink:#2B2B2E; --ink-2:#5E5E66; --ink-3:#9A9AA2;
  --line:#E7E3DC; --green:#2E9E6B; --green-soft:#E3F4EC; --amber:#C98512; --amber-soft:#FBF0DA;
  --blue:#3C6FD8; --blue-soft:#E7EEFB;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Lexend',system-ui,sans-serif;background:var(--cream);color:var(--ink);-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select{font-family:inherit}

/* ---------- Stage ---------- */
.stage{min-height:100%;display:flex;align-items:center;justify-content:center;gap:56px;padding:32px 16px;position:relative;overflow:hidden}
.swirl{position:fixed;pointer-events:none;opacity:.55;z-index:0}
.side{max-width:330px;position:relative;z-index:1}
.side .eyebrow{display:inline-block;border:1.5px solid var(--coral);color:var(--coral);border-radius:999px;padding:4px 14px;font-size:13px;margin-bottom:18px}
.side h1{font-size:64px;line-height:1;color:var(--coral);font-weight:700;letter-spacing:-1.5px}
.side p.lead{margin:12px 0 28px;color:var(--ink-2);font-size:15px;line-height:1.5}
.flow{list-style:none;display:flex;flex-direction:column;gap:4px}
.flow li{display:flex;gap:12px;align-items:center;padding:9px 12px;border-radius:12px;font-size:14px;color:var(--ink-3);transition:.25s}
.flow li .n{width:24px;height:24px;border-radius:50%;border:1.5px solid currentColor;display:grid;place-items:center;font-size:12px;flex:none}
.flow li.done{color:var(--ink-2)}
.flow li.done .n{background:var(--ink-2);border-color:var(--ink-2);color:#fff}
.flow li.on{background:var(--paper);color:var(--coral);font-weight:500;box-shadow:0 2px 10px rgba(0,0,0,.05)}
.flow li.on .n{background:var(--coral);border-color:var(--coral);color:#fff}
.side .ctrl{display:flex;gap:10px;margin-top:24px}
.btn-ghost{border:1.5px solid var(--ink-3);color:var(--ink-2);border-radius:999px;padding:8px 16px;font-size:13px}
.btn-ghost:hover{border-color:var(--coral);color:var(--coral)}
.side .foot{margin-top:28px;font-size:12px;color:var(--ink-3)}

/* ---------- Phone ---------- */
.phone-wrap{position:relative;z-index:1;flex:none;width:390px;height:844px}
.phone{position:absolute;top:0;left:0;transform-origin:top left;width:390px;height:844px;background:#111;border-radius:52px;padding:12px;box-shadow:0 30px 80px rgba(80,30,30,.18),0 0 0 2px #2a2a2a inset}
.device{position:relative;width:100%;height:100%;background:var(--cream);border-radius:41px;overflow:hidden;display:flex;flex-direction:column}
.statusbar{height:46px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:6px 28px 0;font-size:14px;font-weight:600;position:relative;z-index:5}
.notch{position:absolute;left:50%;top:9px;transform:translateX(-50%);width:110px;height:30px;background:#111;border-radius:20px}
.sb-icons{display:flex;gap:6px;align-items:center}
.screen{flex:1;overflow-y:auto;overflow-x:hidden;position:relative;scrollbar-width:none}
.screen::-webkit-scrollbar{display:none}
.tabbar{flex:none;height:78px;background:var(--paper);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:10px 6px 22px}
.tabbar button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;color:var(--ink-3);width:64px}
.tabbar button.on{color:var(--coral)}
.tabbar svg{width:22px;height:22px}
.tabbar .newdot{position:relative}
.tabbar .newdot::after{content:"";position:absolute;top:-1px;right:-3px;width:8px;height:8px;border-radius:50%;background:var(--coral);border:2px solid #fff}

@media (max-width:0px){
  .stage{padding:0}
  .swirl{display:none}
  .phone-wrap{width:100vw;height:100vh;height:100dvh}
  .phone{position:relative;width:100%;height:100%;border-radius:0;padding:0;box-shadow:none;background:var(--cream);transform:none!important}
  .device{border-radius:0}
  .notch{display:none}
}
.locchip{display:inline-flex;gap:5px;align-items:center;padding:6px 11px;border-radius:999px;background:var(--paper);font-size:12.5px;color:var(--ink);font-weight:500;max-width:100%}
.locchip svg{flex:none}
.search{display:flex;align-items:center;gap:10px;height:50px;border-radius:16px;background:var(--cream);padding:0 14px;margin:14px 0 6px;color:var(--ink-3);border:1.5px solid transparent;flex:none}
.search:focus-within{border-color:var(--coral);background:#fff}
.search input{flex:1;border:none;outline:none;background:transparent;font-size:15px;color:var(--ink);min-width:0}
.search button{width:28px;height:28px;place-items:center;border-radius:50%}
.lrow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:11px 8px;border-radius:14px;cursor:pointer;transition:background .15s}
.lrow:hover{background:var(--cream)}
.lrow.on{background:#FFF4F2}
.lrow .lic{width:40px;height:40px;border-radius:13px;background:var(--cream);display:grid;place-items:center;flex:none;color:var(--ink)}
.lrow.on .lic{background:var(--coral-soft);color:var(--coral)}
.lrow.add .lic{border:1.5px dashed var(--ink-3);background:transparent;color:var(--ink-2)}
.lrow .lt{flex:1;min-width:0}
.lrow .lt b{display:block;font-weight:500;font-size:14px}
.lrow .lt small{display:block;color:var(--ink-3);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lrow mark{background:none;color:var(--coral);font-weight:600}
.ldel{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:var(--ink-3);flex:none}
.ldel:hover{background:var(--coral-soft);color:var(--coral)}
.lsave{display:inline-flex;gap:5px;align-items:center;padding:6px 10px;border-radius:999px;border:1.5px solid var(--line);font-size:12px;color:var(--ink-2);flex:none}
.lsave:hover{border-color:var(--coral);color:var(--coral)}
.pk{display:flex;gap:14px;align-items:flex-start;width:100%;text-align:left;background:var(--paper);border-radius:22px;padding:16px;margin-bottom:12px;border:1.5px solid transparent;transition:.2s}
.pk:hover{border-color:var(--coral)}
.pk .avatar{flex:none}
.pk .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
}

/* ---------- Generic UI ---------- */
.pad{padding:8px 20px 28px}
.h-title{font-size:24px;font-weight:600;letter-spacing:-.4px;line-height:1.2}
.muted{color:var(--ink-2)}
.small{font-size:12.5px}
.card{background:var(--paper);border-radius:20px;padding:16px;box-shadow:0 1px 2px rgba(0,0,0,.03)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:52px;border-radius:16px;font-size:15.5px;font-weight:500;transition:transform .1s, opacity .2s}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--coral);color:#fff}
.btn-primary:disabled{opacity:.35;cursor:not-allowed}
.btn-secondary{background:transparent;color:var(--ink-2)}
.btn-outline{border:1.5px solid var(--coral);color:var(--coral);background:var(--paper)}
.chip{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:999px;font-size:11.5px;font-weight:500}
.chip.green{background:var(--green-soft);color:var(--green)}
.chip.coral{background:var(--coral-soft);color:var(--coral-ink)}
.chip.amber{background:var(--amber-soft);color:var(--amber)}
.chip.blue{background:var(--blue-soft);color:var(--blue)}
.chip.gray{background:#EEECE7;color:var(--ink-2)}
.fade-in{animation:fadeIn .35s ease both}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.topnav{display:flex;align-items:center;gap:8px;padding:4px 12px 4px 8px;height:48px}
.topnav .back{width:40px;height:40px;border-radius:50%;display:grid;place-items:center}
.topnav .back:hover{background:rgba(0,0,0,.05)}
.topnav .ttl{font-weight:500;font-size:15px}
.topnav .right{margin-left:auto}

/* ---------- Home ---------- */
.home-head{padding:6px 20px 0;display:flex;align-items:center;gap:12px}
.avatar{width:44px;height:44px;border-radius:50%;background:var(--coral-soft);color:var(--coral);display:grid;place-items:center;font-weight:600}
.cred{margin:18px 20px 0;border-radius:22px;padding:18px;color:#fff;background:linear-gradient(135deg,#3A3A40,#1F1F24);position:relative;overflow:hidden}
.cred::after{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;border:22px solid rgba(238,75,75,.55)}
.cred .lbl{font-size:11px;opacity:.65;letter-spacing:.5px;text-transform:uppercase}
.grid-actions{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:18px 20px 0}
.qa{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11.5px;color:var(--ink-2)}
.qa .ic{width:56px;height:56px;border-radius:18px;background:var(--paper);display:grid;place-items:center;color:var(--ink)}
.qa.new .ic{background:var(--coral);color:#fff;position:relative}
.qa.new .ic::after{content:"NUEVO";position:absolute;top:-7px;right:-8px;font-size:8.5px;font-weight:700;background:var(--ink);color:#fff;padding:2px 5px;border-radius:6px}
.section-t{padding:22px 20px 10px;font-weight:600;font-size:16px;display:flex;justify-content:space-between;align-items:baseline}
.section-t a{font-size:12.5px;color:var(--coral);font-weight:500}
.appt{margin:0 20px;display:flex;gap:14px;align-items:center}
.appt .date{width:54px;height:58px;border-radius:14px;background:var(--cream);display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none}
.appt .date b{font-size:20px;line-height:1}
.appt .date span{font-size:10.5px;color:var(--ink-2);text-transform:uppercase}
.promo{margin:0 20px;border-radius:22px;padding:18px;background:var(--coral);color:#fff;display:flex;gap:14px;align-items:center;cursor:pointer;position:relative;overflow:hidden}
.promo::before{content:"";position:absolute;right:-30px;bottom:-60px;width:150px;height:150px;border-radius:50%;border:18px solid rgba(255,255,255,.18)}

/* ---------- Pop-up ---------- */
.overlay{position:absolute;inset:0;background:rgba(20,15,15,.45);z-index:20;display:flex;align-items:flex-end;opacity:0;pointer-events:none;transition:opacity .3s}
.overlay.show{opacity:1;pointer-events:auto}
.overlay.center{align-items:center;justify-content:center;padding:22px}
.sheet{width:100%;background:var(--paper);border-radius:28px 28px 0 0;padding:10px 20px 30px;transform:translateY(100%);transition:transform .38s cubic-bezier(.2,.9,.25,1);max-height:92%;overflow-y:auto}
.overlay.show .sheet{transform:none}
.grab{width:40px;height:5px;border-radius:5px;background:var(--line);margin:0 auto 14px}
.popup{width:100%;background:var(--paper);border-radius:28px;overflow:hidden;transform:scale(.9);opacity:0;transition:.35s cubic-bezier(.2,.9,.25,1)}
.overlay.show .popup{transform:none;opacity:1}
.popup-hero{background:var(--coral);color:#fff;padding:26px 22px 22px;position:relative;overflow:hidden}
.popup-hero svg.wave{position:absolute;right:-20px;top:-10px;opacity:.35}
.popup-hero .tag{display:inline-block;background:rgba(255,255,255,.2);border-radius:999px;padding:4px 10px;font-size:11px;font-weight:600;letter-spacing:.6px}
.popup-hero h2{font-size:44px;font-weight:700;letter-spacing:-1px;margin-top:10px;line-height:1}
.popup-hero p{font-size:15px;opacity:.95;margin-top:6px;line-height:1.4}
.popup-body{padding:20px 22px 18px}
.feat{display:flex;gap:12px;align-items:flex-start;margin-bottom:13px;font-size:14px;line-height:1.35}
.feat .fi{width:34px;height:34px;border-radius:11px;background:var(--coral-soft);color:var(--coral);display:grid;place-items:center;flex:none}
.feat b{font-weight:500}
.close-x{position:absolute;right:14px;top:14px;width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.22);color:#fff;display:grid;place-items:center;z-index:2}

/* ---------- Consent ---------- */
.hero-mini{padding:4px 20px 0}
.hero-mini .logo{font-size:34px;color:var(--coral);font-weight:700;letter-spacing:-1px}
.list-check{display:flex;flex-direction:column;gap:12px;margin:18px 0}
.list-check div{display:flex;gap:10px;font-size:14px;line-height:1.4;color:var(--ink-2)}
.list-check svg{flex:none;color:var(--green);margin-top:2px}
.checkrow{display:flex;gap:12px;align-items:flex-start;padding:14px;border-radius:16px;background:var(--paper);border:1.5px solid var(--line);cursor:pointer;font-size:13.5px;line-height:1.4;color:var(--ink-2);transition:.2s}
.checkrow.on{border-color:var(--coral);background:#FFF8F7}
.box{width:22px;height:22px;border-radius:7px;border:2px solid var(--ink-3);flex:none;display:grid;place-items:center;transition:.2s;margin-top:1px}
.checkrow.on .box{background:var(--coral);border-color:var(--coral);color:#fff}
.box svg{opacity:0}
.checkrow.on .box svg{opacity:1}

/* ---------- Form ---------- */
.progress{display:flex;gap:6px;padding:0 20px;margin:4px 0 18px}
.progress span{flex:1;height:5px;border-radius:5px;background:#E2DED6;overflow:hidden;position:relative}
.progress span.on{background:var(--coral);transition:background .3s}
@keyframes grow{from{transform:translateX(-100%)}to{transform:none}}
.q{margin-bottom:20px}
.q label.ql{display:block;font-size:14px;font-weight:500;margin-bottom:9px}
.q .hint{font-size:12px;color:var(--ink-3);font-weight:400;margin-left:4px}
.inp{width:100%;height:50px;border-radius:14px;border:1.5px solid var(--line);background:var(--paper);padding:0 14px;font-size:15px;color:var(--ink);outline:none;transition:.2s}
.inp:focus{border-color:var(--coral)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.opt{padding:11px 15px;border-radius:14px;background:var(--paper);border:1.5px solid var(--line);font-size:13.5px;color:var(--ink-2);transition:.18s}
.opt.on{border-color:var(--coral);background:var(--coral-soft);color:var(--coral-ink);font-weight:500}
.unit{position:relative}
.unit span{position:absolute;right:14px;top:50%;transform:translateY(-50%);font-size:13px;color:var(--ink-3)}
.fixed-cta{position:sticky;bottom:0;padding:14px 20px 18px;background:linear-gradient(to top,var(--cream) 70%,rgba(241,239,234,0))}

/* ---------- Loading ---------- */
.loading{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px;text-align:center}
.orb{width:110px;height:110px;border-radius:50%;position:relative;margin-bottom:30px}
.orb::before,.orb::after{content:"";position:absolute;inset:0;border-radius:50%;border:3px solid var(--coral);opacity:.25;animation:pulse 1.8s ease-out infinite}
.orb::after{animation-delay:.9s}
.orb .core{position:absolute;inset:22px;border-radius:50%;background:var(--coral);display:grid;place-items:center;color:#fff}
@keyframes pulse{from{transform:scale(.7);opacity:.6}to{transform:scale(1.35);opacity:0}}
.steps-l{margin-top:26px;display:flex;flex-direction:column;gap:12px;text-align:left;width:100%;max-width:280px}
.steps-l div{display:flex;gap:10px;align-items:center;font-size:13.5px;color:var(--ink-3);transition:.3s}
.steps-l div.ok{color:var(--ink)}
.steps-l .dot{width:20px;height:20px;border-radius:50%;border:2px solid currentColor;display:grid;place-items:center;flex:none}
.steps-l div.ok .dot{background:var(--green);border-color:var(--green);color:#fff}
.steps-l div.run .dot{border-color:var(--coral);border-right-color:transparent;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- Results ---------- */
.res-head{margin:0 20px;border-radius:24px;background:var(--coral);color:#fff;padding:20px;position:relative;overflow:hidden}
.res-head::after{content:"";position:absolute;right:-50px;top:-50px;width:170px;height:170px;border-radius:50%;border:20px solid rgba(255,255,255,.16)}
.res-head .big{font-size:40px;font-weight:700;line-height:1}
.ring{display:flex;gap:16px;align-items:center;margin-top:14px;position:relative;z-index:1}
.stat{background:rgba(255,255,255,.16);border-radius:14px;padding:9px 12px;font-size:11.5px;flex:1}
.stat b{display:block;font-size:18px}
.disclaimer{margin:14px 20px 0;display:flex;gap:10px;padding:12px 14px;border-radius:14px;background:var(--blue-soft);color:#2F4E95;font-size:12px;line-height:1.45}
.disclaimer svg{flex:none;margin-top:1px}
.tabs{display:flex;margin:18px 20px 4px;background:#E6E2DA;border-radius:14px;padding:4px}
.tabs button{flex:1;height:38px;border-radius:11px;font-size:13.5px;color:var(--ink-2);font-weight:500}
.tabs button.on{background:var(--paper);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.06)}
.grp-t{padding:16px 20px 8px;font-size:12px;font-weight:600;color:var(--ink-3);text-transform:uppercase;letter-spacing:.7px;display:flex;align-items:center;gap:8px}
.rec{margin:0 20px 12px;background:var(--paper);border-radius:20px;padding:16px;transition:.3s}
.rec.gone{opacity:0;transform:translateX(60px);height:0;padding:0;margin-bottom:0;overflow:hidden}
.rec-top{display:flex;gap:12px}
.rec-ic{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;flex:none;background:var(--coral-soft);color:var(--coral)}
.rec-ic.m{background:var(--amber-soft);color:var(--amber)}
.rec-ic.h{background:var(--green-soft);color:var(--green)}
.rec h3{font-size:15.5px;font-weight:500;line-height:1.3}
.rec .meta{font-size:12.5px;color:var(--ink-2);margin-top:2px}
.rec .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.why-btn{margin-top:12px;font-size:12.5px;color:var(--blue);font-weight:500;display:flex;align-items:center;gap:5px}
.why{max-height:0;overflow:hidden;transition:max-height .35s ease}
.why.open{max-height:420px}
.why-in{margin-top:10px;padding:12px;border-radius:12px;background:var(--cream);font-size:12.5px;line-height:1.5;color:var(--ink-2)}
.why-in b{color:var(--ink);font-weight:500}
.rec-act{display:flex;gap:8px;margin-top:14px}
.rec-act .btn{height:42px;font-size:13.5px;border-radius:12px}
.rec-act .btn-primary{flex:1.4}
.rec-act .btn-outline{flex:1;border-color:var(--line);color:var(--ink-2)}
.rec.booked .rec-act{display:none}
.booked-bar{display:none;margin-top:12px;padding:10px 12px;border-radius:12px;background:var(--green-soft);color:var(--green);font-size:12.5px;font-weight:500;gap:8px;align-items:center}
.rec.booked .booked-bar{display:flex}
.upd{margin:0 20px 12px;background:var(--paper);border:1.5px solid var(--green-soft);border-radius:16px;padding:12px 14px;display:flex;gap:10px;align-items:flex-start;line-height:1.4;font-size:13px;color:var(--ink-2)}
.upd .ok{width:26px;height:26px;border-radius:50%;background:var(--green-soft);color:var(--green);display:grid;place-items:center;flex:none}

/* Calendar */
.tl{padding:8px 20px 20px}
.tl-m{display:flex;gap:14px}
.tl-m .rail{display:flex;flex-direction:column;align-items:center;width:52px;flex:none}
.tl-m .mon{font-size:12px;font-weight:600;color:var(--coral);text-transform:uppercase;background:var(--coral-soft);padding:5px 0;border-radius:10px;width:100%;text-align:center}
.tl-m .line{flex:1;width:2px;background:#DCD7CE;margin:4px 0}
.tl-items{flex:1;padding-bottom:18px;display:flex;flex-direction:column;gap:8px}
.tl-it{background:var(--paper);border-radius:14px;padding:11px 13px;font-size:13.5px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.tl-it small{display:block;color:var(--ink-3);font-size:11.5px}

/* Booking sheet */
.sheet h3{font-size:19px;font-weight:600}
.lbl-s{font-size:13px;font-weight:500;margin:18px 0 9px;color:var(--ink-2)}
.center{display:flex;gap:12px;align-items:center;padding:12px 14px;border:1.5px solid var(--line);border-radius:16px;margin-bottom:8px;width:100%;text-align:left;transition:.2s}
.center.on{border-color:var(--coral);background:#FFF8F7}
.center .rd{width:20px;height:20px;border-radius:50%;border:2px solid var(--ink-3);flex:none;position:relative}
.center.on .rd{border-color:var(--coral)}
.center.on .rd::after{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--coral)}
.center b{font-weight:500;font-size:14px;display:block}
.center small{color:var(--ink-3);font-size:12px}
.days{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.days::-webkit-scrollbar{display:none}
.day{flex:none;width:58px;padding:9px 0;border-radius:14px;border:1.5px solid var(--line);display:flex;flex-direction:column;align-items:center;font-size:11px;color:var(--ink-2);transition:.2s}
.day b{font-size:18px;color:var(--ink);font-weight:600}
.day.on{background:var(--coral);border-color:var(--coral);color:#fff}
.day.on b{color:#fff}
.times{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.time{height:40px;border-radius:12px;border:1.5px solid var(--line);font-size:13.5px;transition:.2s}
.time.on{background:var(--ink);border-color:var(--ink);color:#fff}
.time:disabled{opacity:.35;text-decoration:line-through;cursor:not-allowed}
.prep{margin-top:16px;padding:12px 14px;background:var(--amber-soft);color:#7A5310;border-radius:14px;font-size:12.5px;line-height:1.45;display:flex;gap:10px}

/* Success */
.success{padding:30px 22px;text-align:center}
.tick{width:92px;height:92px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;margin:20px auto 22px;animation:pop .5s cubic-bezier(.2,1.6,.4,1) both}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
.ticket{background:var(--paper);border-radius:22px;padding:18px;text-align:left;margin:22px 0 16px}
.ticket .r{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px dashed var(--line);font-size:13.5px}
.ticket .r:last-child{border:none}
.ticket .r span{color:var(--ink-3)}
.ticket .r b{font-weight:500;text-align:right}

/* Feedback "ya me lo hice" */
.fb-opts{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.fb-opts .opt{text-align:left;border-radius:14px;padding:13px 15px}

.toast{position:absolute;left:50%;bottom:96px;transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:11px 16px;border-radius:14px;font-size:13px;opacity:0;transition:.3s;z-index:40;white-space:nowrap;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ===== Responsive: app a pantalla completa ===== */
html,body{height:100%;overflow:hidden}
.stage{padding:0;display:block;height:100%}
.swirl{display:none}
.phone-wrap{width:100%;height:100%}
.phone{position:relative;width:100%;height:100%;border-radius:0;padding:0;box-shadow:none;background:var(--cream);transform:none}
.device{border-radius:0;height:100%}
.statusbar{display:none}
.screen{padding-top:env(safe-area-inset-top)}
.page{min-height:100%;padding-top:8px}
.page-loading{height:100%}
.tabbar{display:flex;height:auto;padding-bottom:calc(12px + env(safe-area-inset-bottom))}
.hcol,.colL,.colR{min-width:0}
@media (min-width:900px){
  .device{display:grid;grid-template-columns:248px 1fr;grid-template-rows:100%}
  .device.notabs{grid-template-columns:1fr}
  .screen{grid-column:-2/-1;grid-row:1}
  .tabbar{grid-column:1;grid-row:1;flex-direction:column;justify-content:flex-start;gap:4px;border-top:none;border-right:1px solid var(--line);padding:28px 16px}
  .tabbar::before{content:"Plany";font-size:34px;font-weight:700;color:var(--coral);letter-spacing:-1px;padding:0 14px 22px}
  .tabbar button{flex-direction:row;width:100%;gap:12px;font-size:14.5px;padding:11px 14px;border-radius:12px;justify-content:flex-start}
  .tabbar button:hover{background:var(--cream)}
  .tabbar button.on{background:var(--coral-soft);font-weight:500}
  .page{max-width:1120px;margin:0 auto;padding:28px 36px 40px}

  .page-picker{max-width:1040px}

  .home-head + div{padding-left:0!important;padding-right:0!important}

  .hcol > *{margin-left:0!important;margin-right:0!important}
  .hcol .section-t:first-child{padding-top:12px}
  .cred{padding:24px;min-height:170px}

  .colL > *{margin:0!important}
  .colL .res-head{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:32px;padding:24px 28px}
  .colL .res-head > div:nth-child(2){margin-top:4px!important}
  .colL .res-head .big{font-size:56px}
  .colL .res-head .ring{margin-top:0;flex:0 0 420px}
  .colL .res-head > div:first-child{position:absolute!important;top:22px;left:28px}
  .colL .res-head{min-height:150px;align-items:flex-end}
  .colL .donebn{grid-column:1/-1;order:3}
  .colL .disclaimer{order:1}
  .colL .profcard{order:2}
  .colL .disclaimer{align-items:center}
  .colL .profcard{align-self:start}
  .colR{margin-top:26px}
  .colR > *{margin-left:0!important;margin-right:0!important}
  .colR .tl, .colR .grp-t{padding-left:0;padding-right:0}
  .colR .tabs{margin-top:0;max-width:420px}
  .colR .grp-t{padding-top:22px}
  .rgrid{display:flex;flex-direction:column;gap:12px}
  .rgrid .rec{margin:0;display:grid;grid-template-columns:minmax(0,1fr) 200px;column-gap:28px;padding:18px 22px}
  .rgrid .rec > *{grid-column:1}
  .rgrid .rec .chips, .rgrid .rec .why-btn, .rgrid .rec .why{margin-left:58px}
  .rgrid .rec .rec-act, .rgrid .rec .booked-bar{grid-column:2;grid-row:1/span 4;align-self:center;margin-top:0}
  .rgrid .rec .rec-act{flex-direction:column;gap:8px}
  .rgrid .rec .rec-act .btn{flex:none;width:100%}
  .rgrid .rec .booked-bar{flex-direction:column;align-items:flex-start;text-align:left}
  .ugrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
  .ugrid .upd{margin:0}
  .colR .tl{max-width:760px}
  .pkgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:8px}
  .pk{flex-direction:column;margin:0;padding:22px;height:100%}
  .page-picker .h-title{font-size:30px}
  .fixed-cta{padding-left:0;padding-right:0;position:static;background:none}
  .overlay{align-items:center;justify-content:center;padding:32px}
  .sheet{width:min(520px,100%);border-radius:24px;padding:22px 26px 24px;transform:translateY(24px) scale(.97);opacity:0;transition:transform .3s cubic-bezier(.2,.9,.25,1),opacity .25s}
  .overlay.show .sheet{opacity:1}
  .grab{display:none}
  .popup{max-width:440px}
  .toast{bottom:32px}
  .success .tick{margin-top:0}
}

      <div>${I.checkC}<span>Solo para armar tu plan de prevención. <b style="color:var(--ink);font-weight:500">Nunca para modificar tu cuota ni tu cobertura.</b></span></div>
      <div>${I.checkC}<span>Las recomendaciones salen de reglas aprobadas por la Dirección Médica; la IA solo las personaliza.</span></div>

    </div>

      <div class="checkrow ${c[1]?'on':''}" onclick="S.consent[1]=!S.consent[1];render()"><span class="box">${I.check}</span><span>Quiero recibir recordatorios de mis chequeos por notificación o mail <span style="color:var(--ink-3)">(opcional)</span>.</span></div>

      <div><span class="dot"></span>Verificando cobertura de tu plan</div>
      <div><span class="dot"></span>Buscando turnos cerca tuyo</div>
    </div></div>`;
}
function runLoading(){
  const items=[...document.querySelectorAll('#lsteps div')];
  let i=0;
  const tick=()=>{
    if(S.screen!=='loading') return;
    items.forEach((el,j)=>{ el.className = j<i?'ok':(j===i?'run':''); if(j<i) el.querySelector('.dot').innerHTML=I.check; });
    if(i>items.length){ recs = engine(S.p); view='recs'; go('results'); return; }
    i++; setTimeout(tick, i===1?250:650);
  };
  tick();
}

/* ================= ENGINE (reglas clínicas acotadas = guardrails) ================= */
function engine(p){
  const age=+p.age, F=p.sex==='F', M=p.sex==='M', fam=p.fam, cond=p.cond, done=p.done;
  const imc = (p.height&&p.weight)? (+p.weight/((+p.height/100)**2)) : null;
  const out=[];
  const add=(o)=>out.push(Object.assign({prio:'media',cover:'Cubierto 100% · PMO'},o));

  const overdue = p.last==='>2'||p.last==='nr';
  add({id:'clinico', title:'Control clínico anual', spec:'Clínica médica', icon:'steth', freq:'1 vez por año',
    prio: overdue?'alta':'media',
    why: overdue ? `<b>${p.last==='nr'?'No recordás':'Pasaron más de 2 años desde'}</b> tu último chequeo general. Es la puerta de entrada: control de presión, peso y revisión de tus antecedentes.` : 'Recomendado <b>una vez por año</b> para todos los adultos: control de presión arterial, peso y revisión general.',
    prep:null, doneKey:'clinico'});

  const labRisk = cond.includes('diabetes')||cond.includes('colesterol')||fam.includes('diabetes')||(imc&&imc>=30);
  add({id:'lab', title:'Laboratorio de rutina', spec:'Análisis de sangre y orina', icon:'flask', freq: labRisk?'1 vez por año':'Cada 1–2 años',
    prio: labRisk?'alta':'media',
    why: labRisk ? `Por ${[fam.includes('diabetes')&&'tus antecedentes familiares de diabetes',cond.includes('diabetes')&&'tu diagnóstico de diabetes',cond.includes('colesterol')&&'tu colesterol alto',(imc&&imc>=30)&&'tu índice de masa corporal'].filter(Boolean).join(' y ')}, conviene controlar <b>glucemia y perfil lipídico</b> todos los años.` : 'Incluye <b>glucemia, colesterol y función renal</b>. Detecta alteraciones que no dan síntomas.',
    prep:'Requiere <b>ayuno de 8 a 12 horas</b>. Podés tomar agua.', doneKey:'lab'});

  if(F && age>=25 && age<=65) add({id:'pap', title: age>=30?'PAP y test de VPH':'Papanicolaou (PAP)', spec:'Ginecología', icon:'ribbon', freq: age>=30?'Cada 3 a 5 años':'Cada 3 años',
    why:`Para mujeres de <b>25 a 65 años</b> es el estudio clave para la prevención del cáncer de cuello uterino${age>=30?'; desde los 30 se suma el test de VPH':''}.`,
    prep:'Evitá relaciones sexuales y óvulos 48 h antes. No se realiza durante la menstruación.', doneKey:'pap'});

  const mamaFam = fam.includes('mama');
  if(F && (age>=40 || (mamaFam && age>=30))) add({id:'mamo', title:'Mamografía', spec:'Diagnóstico por imágenes', icon:'ribbon', freq:'1 vez por año',
    prio: mamaFam?'alta':'media',
    why: mamaFam && age<40 ? `Tenés <b>antecedentes familiares de cáncer de mama</b>: se recomienda adelantar el control y conversarlo con tu ginecólogo/a.` : 'Recomendada <b>anualmente desde los 40 años</b> para detectar lesiones antes de que sean palpables.',
    prep:'No uses desodorante, talco ni cremas en axilas y mamas el día del estudio.', doneKey:'mamo'});

  const colonFam = fam.includes('colon');
  if(age>=50 || (colonFam && age>=40)) add({id:'colon', title: colonFam?'Colonoscopía':'Test de sangre oculta en materia fecal', spec:'Gastroenterología', icon:'shield', freq: colonFam?'Cada 5 años':'Cada 1–2 años',
    prio: colonFam?'alta':'media',
    why: colonFam ? 'Por tus <b>antecedentes familiares de cáncer de colon</b>, la recomendación es una colonoscopía a partir de los 40 años.' : 'El rastreo de cáncer colorrectal está indicado <b>desde los 50 años</b>.',
    prep: colonFam?'Requiere preparación intestinal el día previo; te enviamos las indicaciones.':'Se retira un kit en el centro y se entrega la muestra.', doneKey:null});

  const prosFam = fam.includes('prostata');
  if(M && (age>=50 || (prosFam && age>=45))) add({id:'uro', title:'Consulta urológica (PSA)', spec:'Urología', icon:'steth', freq:'Según indicación médica',
    why: prosFam ? 'Por <b>antecedentes familiares de cáncer de próstata</b> se sugiere conversar el control desde los 45 años.' : 'Desde los 50 años se recomienda <b>conversar con un urólogo</b> si realizar el PSA, evaluando beneficios y riesgos.', doneKey:null});

  const cvFactors = [age>=40, p.smoke==='si', cond.includes('hta'), cond.includes('colesterol'), cond.includes('diabetes'), fam.includes('cardio')].filter(Boolean).length;
  if(cvFactors>=1 && (age>=40 || cvFactors>=2 || fam.includes('cardio'))) add({id:'cardio', title:'Evaluación cardiológica', spec:'Cardiología · ECG', icon:'heart', freq: cvFactors>=2?'1 vez por año':'Cada 2 años',
    prio: cvFactors>=2?'alta':'media',
    why:`Sumás <b>${cvFactors} factor${cvFactors>1?'es':''} de riesgo cardiovascular</b> (${[age>=40&&'edad',p.smoke==='si'&&'tabaco',cond.includes('hta')&&'presión alta',cond.includes('colesterol')&&'colesterol',cond.includes('diabetes')&&'diabetes',fam.includes('cardio')&&'antecedente familiar'].filter(Boolean).join(', ')}). Un electrocardiograma y consulta permiten anticiparse.`,
    doneKey:'cardio'});

  if(p.smoke==='si') add({id:'tabaco', title:'Programa para dejar de fumar', spec:'Neumonología · Consejería', icon:'lungs', freq:'Acompañamiento de 3 meses', prio:'alta',
    why:'Dejar de fumar es <b>la medida preventiva de mayor impacto</b> en tu salud. El programa incluye acompañamiento profesional y, si corresponde, tratamiento.', doneKey:null});
  if((p.smoke==='si'||p.smoke==='ex') && age>=40 || cond.includes('asma')) add({id:'espiro', title:'Espirometría', spec:'Neumonología', icon:'lungs', freq:'Cada 2 años',
    why: cond.includes('asma')?'Por tu diagnóstico de asma/EPOC, la espirometría permite <b>controlar la función pulmonar</b>.':'Por antecedente de <b>tabaquismo y edad mayor a 40</b>, se recomienda evaluar la función pulmonar.', doneKey:null});

  if(age>=40 || cond.includes('diabetes')) add({id:'oftalmo', title:'Control oftalmológico', spec:'Oftalmología', icon:'eye', freq: cond.includes('diabetes')?'1 vez por año':'Cada 2 años',
    why: cond.includes('diabetes')?'La diabetes puede afectar la retina: se recomienda <b>fondo de ojo anual</b>.':'Desde los 40 años aumenta el riesgo de <b>glaucoma y presbicia</b>: control con medición de presión ocular.', doneKey:'oftalmo'});

  if(fam.includes('piel')) add({id:'derma', title:'Control de lunares', spec:'Dermatología', icon:'sun', freq:'1 vez por año',
    why:'Por <b>antecedentes familiares de cáncer de piel</b>, un control dermatológico anual permite detectar cambios a tiempo.', doneKey:null});

  if(imc && (imc>=30 || (imc>=25 && p.activity==='baja'))) add({id:'nutri', title:'Consulta con nutrición', spec:'Nutrición', icon:'apple', freq:'Según plan', cover:'Cubierto · coseguro bajo',
    why:`Tu índice de masa corporal es <b>${imc.toFixed(1)}</b>${p.activity==='baja'?' y hacés poca actividad física':''}. Un plan alimentario personalizado ayuda a prevenir diabetes y enfermedad cardiovascular.`, doneKey:null});

  add({id:'odonto', title:'Control odontológico', spec:'Odontología', icon:'tooth', freq:'Cada 6 a 12 meses',
    why:'Limpieza y control de caries y encías. Recomendado <b>al menos una vez por año</b>.', doneKey:'odonto'});

  add({id:'vacunas', title:'Revisión de vacunas', spec:'Vacunatorio', icon:'syringe', freq:'Según calendario nacional',
    prio: cond.length?'alta':'media',
    why: cond.length ? 'Por tener una condición crónica, te corresponde la <b>antigripal anual</b> y revisar neumococo, doble adulto y hepatitis B.' : 'Revisamos tu <b>doble adulto (cada 10 años) y hepatitis B</b> según el Calendario Nacional de Vacunación.', doneKey:null});

  out.forEach(r=>{
    if(!r.doneKey) return;
    const h = p.hist.find(x=>x.key===r.doneKey), inc = p.hist.find(x=>(x.incl||[]).includes(r.doneKey));
    if(h){ r.upToDate=true; r.doneInfo={date:h.date, where:h.where}; }
    else if(inc){ r.upToDate=true; r.doneInfo={date:inc.date, where:inc.where, note:'Incluido en tu chequeo clínico completo'}; }
  });
  // ordenar: alta primero
  out.sort((a,b)=>(a.prio==='alta'?0:1)-(b.prio==='alta'?0:1));
  return out;
}
const pending = ()=>recs.filter(r=>!r.upToDate && !S.dismissed[r.id]);

function toggleWhy(id){
  const w=document.getElementById('why-'+id), c=document.getElementById('chev-'+id);

}
function rResults(){
  const list = pending();

  const upd = recs.filter(r=>r.upToDate || S.dismissed[r.id]);
  const nb = Object.keys(S.booked).length;
  const nav = `<div class="topnav"><button class="back" onclick="go('home')">${I.back}</button><span class="ttl">Plany</span><span class="right" style="min-width:0">${locChip()}</span></div>`;
  const head = `
  <div class="res-head fade-in">
    <div style="font-size:13px;opacity:.9;position:relative;z-index:1">Tu plan de prevención ${today.getFullYear()}–${today.getFullYear()+1}</div>
    <div style="display:flex;align-items:baseline;gap:10px;position:relative;z-index:1;margin-top:6px"><span class="big">${list.length}</span><span style="font-size:15px">chequeos recomendados<br>para ${S.p.name||'vos'}</span></div>
    <div class="ring">

  ${doneBanner()}
  ${profileCard()}`;
  const tabs = `<div class="tabs"><button class="${view==='recs'?'on':''}" onclick="view='recs';render()">Recomendaciones</button><button class="${view==='cal'?'on':''}" onclick="view='cal';render()">Calendario</button></div>`;
  const wrap = b => `<div>${nav}<div class="rcols"><div class="colL">${head}</div><div class="colR">${tabs}${b}</div></div></div>`;
  if(view==='cal') return wrap(rCalendar(list));
  return wrap(`
    ${alta.length?`<div class="grp-t"><span style="width:8px;height:8px;border-radius:50%;background:var(--coral)"></span>Para hacer pronto</div><div class="rgrid">${alta.map(recCard).join('')}</div>`:''}
    ${media.length?`<div class="grp-t"><span style="width:8px;height:8px;border-radius:50%;background:var(--amber)"></span>Durante este año</div><div class="rgrid">${media.map(recCard).join('')}</div>`:''}
    ${upd.length?`<div class="grp-t"><span style="width:8px;height:8px;border-radius:50%;background:var(--green)"></span>Ya estás al día</div><div class="rgrid ugrid">${upd.map(r=>{const d=r.doneInfo; return `<div class="upd"><span class="ok">${I.check}</span><div style="flex:1;min-width:0"><div style="color:var(--ink);font-weight:500">${r.title}</div>${d?`<div class="small">${d.note?d.note+' · ':''}Realizado el ${fmtD(d.date)} · ${d.where}</div><div class="small" style="color:var(--green);margin-top:3px;font-weight:500">Próximo control: ${nextDue(d.date,r.doneKey)}</div>`:`<div class="small">Marcado por vos: ${S.dismissed[r.id]}</div>`}</div></div>`}).join('')}</div>`:''}
    <div style="height:20px"></div>`);
}
function rCalendar(list){
  const months = {};
  let mi = 0;
  list.forEach((r,i)=>{
    let off;
    if(S.booked[r.id]) off = S.booked[r.id].monthOff;
    else off = r.prio==='alta' ? Math.min(Math.floor(i/2),1) : 1 + (mi++ % 6);
    const d = new Date(today.getFullYear(), today.getMonth()+off, 1);
    const k = d.getFullYear()*100+d.getMonth();
    (months[k] = months[k]||{d,items:[]}).items.push(r);
  });
  const keys = Object.keys(months).sort();
  return `<div class="tl fade-in">${keys.map((k,idx)=>{const m=months[k];return `<div class="tl-m">
    <div class="rail"><span class="mon">${MES[m.d.getMonth()]}</span>${idx<keys.length-1?'<span class="line"></span>':''}</div>
    <div class="tl-items">${m.items.map(r=>`<div class="tl-it"><div>${r.title}<small>${r.spec}</small></div>${S.booked[r.id]?`<span class="chip green">${S.booked[r.id].dayLabel}</span>`:`<button class="chip coral" onclick="openBooking('${r.id}')">Agendar</button>`}</div>`).join('')}</div>
  </div>`}).join('')}
  <div class="card" style="display:flex;gap:10px;align-items:center;font-size:12.5px;color:var(--ink-2);margin-top:4px">${I.bell}<span>${S.consent[1]?'Te vamos a avisar 2 semanas antes de cada chequeo.':'Activá los recordatorios para que te avisemos antes de cada chequeo.'}</span></div>
  </div>`;
}

/* ===== Booking ===== */
const centers = ()=>LOCS[S.loc.z].c;
function nextDays(n){ const out=[]; const d=new Date(today); while(out.length<n){ d.setDate(d.getDate()+1); if(d.getDay()!==0) out.push(new Date(d)); } return out; }
function openBooking(id){
  const r = recs.find(x=>x.id===id);
  S.booking = {id, c:0, d:1, t:null};
  drawBooking(r);
  requestAnimationFrame(()=>overlay.classList.add('show'));
}
function drawBooking(r){
  r = r || recs.find(x=>x.id===S.booking.id);
  const B=S.booking, days=nextDays(8), times=['08:00','08:30','09:15','10:00','11:30','14:00','15:45','17:30'];
  const taken = i => ((i*3 + B.d*5 + B.c*2) % 7)===0;
  overlay.className='overlay show';
  overlay.innerHTML = `<div class="sheet"><div class="grab"></div>
    <div style="display:flex;gap:12px;align-items:center"><div class="rec-ic">${I[r.icon]}</div><div><h3>${r.title}</h3><div class="small muted">${r.spec}</div></div></div>
    <div class="lbl-s" style="display:flex;justify-content:space-between;align-items:center;gap:8px"><span>Centros cerca de <b style="color:var(--ink);font-weight:500">${S.loc.label}</b></span><button style="color:var(--coral);font-weight:500;font-size:13px" onclick="openLoc(true)">Cambiar</button></div>
    ${centers().map((c,i)=>`<button class="center ${B.c===i?'on':''}" onclick="S.booking.c=${i};S.booking.t=null;drawBooking()"><span class="rd"></span><span style="flex:1"><b>${c.n}</b><small>${c.dist} · ${c.addr}</small></span>${i===0?'<span class="chip green">Más cerca</span>':''}</button>`).join('')}
    <div class="lbl-s">Día</div>
    <div class="days">${days.map((d,i)=>`<button class="day ${B.d===i?'on':''}" onclick="S.booking.d=${i};S.booking.t=null;drawBooking()">${DIA[d.getDay()]}<b>${d.getDate()}</b>${MES[d.getMonth()]}</button>`).join('')}</div>
    <div class="lbl-s">Horario</div>
    <div class="times">${times.map((t,i)=>`<button class="time ${B.t===t?'on':''}" ${taken(i)?'disabled':''} onclick="S.booking.t='${t}';drawBooking()">${t}</button>`).join('')}</div>
    ${r.prep?`<div class="prep">${I.info}<span><b style="font-weight:600">Preparación:</b> ${r.prep}</span></div>`:''}
    <button class="btn btn-primary" style="margin-top:18px" ${B.t?'':'disabled'} onclick="confirmBooking()">Confirmar turno</button>
    <button class="btn btn-secondary" style="height:44px" onclick="closeOverlay()">Cancelar</button>
  </div>`;
}
function confirmBooking(){
  const B=S.booking, d=nextDays(8)[B.d];
  const monthOff = (d.getFullYear()-today.getFullYear())*12 + d.getMonth()-today.getMonth();
  S.booked[B.id] = {center:centers()[B.c].n, centerD:centers()[B.c].addr, time:B.t, date:d, dayLabel:`${DIA[d.getDay()]} ${d.getDate()} ${MES[d.getMonth()]}`, monthOff};
  go('success');
}
function rSuccess(){
  const B=S.booked[S.booking.id], r=recs.find(x=>x.id===S.booking.id);
  return `<div class="success fade-in">
    <div class="tick"><svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
    <div class="h-title">¡Turno confirmado!</div>
    <p class="muted" style="font-size:14px;margin-top:6px">Un paso más en tu plan de prevención.</p>
    <div class="ticket">
      <div class="r"><span>Estudio</span><b>${r.title}</b></div>
      <div class="r"><span>Fecha</span><b>${DIA[B.date.getDay()]} ${B.date.getDate()} de ${MESL[B.date.getMonth()].toLowerCase()} · ${B.time} hs</b></div>
      <div class="r"><span>Lugar</span><b>${B.center}<br><span style="font-weight:400;color:var(--ink-3);font-size:12px">${B.centerD}</span></b></div>
      <div class="r"><span>Cobertura</span><b style="color:var(--green)">${r.cover}</b></div>
    </div>
    ${r.prep?`<div class="prep" style="text-align:left;margin:0 0 16px">${I.bell}<span>Te vamos a recordar 48 h antes: ${r.prep}</span></div>`:''}
    <button class="btn btn-outline" onclick="toast('Evento agregado a tu calendario')">${I.cal} Agregar al calendario</button>
    <button class="btn btn-primary" style="margin-top:10px" onclick="view='recs';go('results')">Volver a mi plan · ${pending().filter(x=>!S.booked[x.id]).length} pendientes</button>
  </div>`;
}

/* ================= CONTROLS ================= */
function restart(){ S=fresh(); recs=[]; view='recs'; go('picker'); }
function toPicker(){ recs=[]; view='recs'; S=fresh(); go('picker'); }
function pickProfile(i){ profIdx=i; S=fresh(); recs=[]; view='recs'; go('home'); setTimeout(showPopup,1000); }
function rPicker(){
  const tag=(t,c)=>`<span class="chip ${c}">${t}</span>`;
  return `<div class="fade-in" style="padding:10px 20px 28px">
    <span class="chip coral" style="margin-bottom:14px">PRE-ENTREGA · DEMO</span>
    <div style="font-size:40px;color:var(--coral);font-weight:700;letter-spacing:-1px;line-height:1">Plany</div>
    <div class="h-title" style="margin-top:12px">¿Con qué afiliado querés probar?</div>
    <p class="muted small" style="margin:6px 0 20px;line-height:1.5">Cada perfil simula la información que la app ya tiene del afiliado: datos personales, ubicación e historia clínica.</p>
    <div class="pkgrid">${PROFILES.map((p,i)=>`<button class="pk" onclick="pickProfile(${i})">
      <span class="avatar">${p.name[0]}</span>
      <span style="flex:1;min-width:0">
        <span style="display:flex;justify-content:space-between;align-items:baseline;gap:8px"><b style="font-weight:600;font-size:16px">${p.name}</b><span class="small muted">${p.age} años · ${p.sex==='F'?'Mujer':'Hombre'}</span></span>
        <span class="small muted" style="display:block;margin-top:4px;line-height:1.45">${p.blurb}</span>
        <span class="tags">${tag(LOCS[p.loc].n,'gray')}${p.hist.some(h=>h.key==='clinico')?tag('Chequeo completo hecho','green'):''}${p.upcoming.length?tag('Turno ya sacado','blue'):''}${p.fam.length?tag('Antecedentes familiares','amber'):''}</span>
      </span>
    </button>`).join('')}</div>
    <p style="text-align:center;font-size:11.5px;color:var(--ink-3);margin-top:14px;line-height:1.5">Prototipo académico · GPD II Equipo 5<br>Datos ficticios. Las recomendaciones no constituyen indicación médica.</p>
  </div>`;
}
function doneBanner(){
  const h=S.p.hist.find(x=>x.key==='clinico'); if(!h) return '';
  const inc=(h.incl||[]).map(k=>({lab:'laboratorio',cardio:'electrocardiograma'}[k]||LBL.done[k]));
  return `<div class="card donebn" style="margin:12px 20px 0;background:var(--green-soft);box-shadow:none;display:flex;gap:12px;align-items:flex-start">
    <span style="color:var(--green);flex:none;margin-top:1px">${I.checkC}</span>
    <div style="font-size:13px;color:#1F6B49;line-height:1.5"><b style="font-weight:600">Ya te hiciste tu chequeo clínico completo</b> el ${fmtDL(h.date)} en ${h.where}.${inc.length?` Incluyó ${inc.join(' y ')}, así que no te los volvemos a recomendar por ahora.`:''} Te avisamos en ${nextDue(h.date,'clinico')} para el próximo.</div>
  </div>`;
}
function toggleProf(){ const w=document.getElementById('profDet'), c=document.getElementById('profChev'); w.classList.toggle('open'); c.style.transform=w.classList.contains('open')?'rotate(180deg)':''; }
function profileCard(){
  const p=S.p;
  const rows = [
    ['Perfil', `${p.age} años · ${p.sex==='F'?'Femenino':'Masculino'}`],
    ['Antecedentes familiares', p.fam.length? p.fam.map(f=>LBL.fam[f]).join(', ').replace(/^./,m=>m.toUpperCase()) : 'Sin registros'],
    ['Condiciones', p.cond.length? p.cond.map(c=>LBL.cond[c]).join(', ') : 'Sin registros'],
    ['Hábitos', LBL.smoke[p.smoke]],
    ['Último chequeo general', LBL.last[p.last].replace(/^./,m=>m.toUpperCase())],
    ['Estudios del último año', p.done.length? p.done.map(d=>LBL.done[d]).join(', ') : 'Ninguno'],
  ];
  return `<div class="card profcard" style="margin:12px 20px 0;padding:14px 16px">
    <button style="display:flex;align-items:center;gap:10px;width:100%;text-align:left" onclick="toggleProf()">
      <span style="width:32px;height:32px;border-radius:10px;background:var(--cream);display:grid;place-items:center;flex:none">${I.user.replace('<svg ','<svg width="18" height="18" ')}</span>
      <span style="flex:1;font-size:13.5px;font-weight:500">Datos usados de tu historia clínica</span>
      <span id="profChev" style="display:inline-flex;transition:.25s;color:var(--ink-3)">${I.chev}</span>
    </button>
    <div class="why" id="profDet"><div style="margin-top:10px">${rows.map(r=>`<div style="display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-top:1px solid var(--line);font-size:12.5px"><span style="color:var(--ink-3)">${r[0]}</span><span style="text-align:right">${r[1]}</span></div>`).join('')}
      <div style="font-size:11.5px;color:var(--ink-3);margin-top:8px">¿Algo no es correcto? Podés actualizarlo con tu médico de cabecera o desde Perfil.</div></div></div>
  </div>`;
}

render();
</script>
</body>
</html>
